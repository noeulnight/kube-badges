apiVersion: v1
kind: Namespace
metadata:
  name: kube-badges
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kube-badges
  namespace: kube-badges
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kube-badges-reader
rules:
  - apiGroups: [""]
    resources:
      - pods
      - nodes
      - services
      - namespaces
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources:
      - deployments
      - statefulsets
      - daemonsets
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kube-badges-reader-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kube-badges-reader
subjects:
  - kind: ServiceAccount
    name: kube-badges
    namespace: kube-badges
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kube-badges
  namespace: kube-badges
  labels:
    app: kube-badges
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kube-badges
  template:
    metadata:
      labels:
        app: kube-badges
    spec:
      serviceAccountName: kube-badges
      containers:
        - name: kube-badges
          image: kube-badges:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: kube-badges
  namespace: kube-badges
  labels:
    app: kube-badges
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app: kube-badges
---
